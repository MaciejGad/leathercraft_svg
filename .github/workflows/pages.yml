name: Publish Pyodide Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp static/pyodide_index.html _site/index.html
          cp static/pyodide_editor.js _site/pyodide_editor.js
          cp static/pyodide_runtime.js _site/pyodide_runtime.js
          cp static/tutorial.html _site/tutorial.html
          cp static/tutorial.js _site/tutorial.js
          cp leathercraft_svg.py _site/leathercraft_svg.py
          cp leathercraft_dsl.py _site/leathercraft_dsl.py
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
