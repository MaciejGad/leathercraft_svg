name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system libraries for CairoSVG
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev libjpeg-dev libpng-dev

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install test dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pytest cairosvg ezdxf

      - name: Run test suite
        run: ./test.sh
